# CliBridge configuration
# Place this file at:
#   ./cli-bridge.toml (project-local)
#   ~/.config/cli-bridge/config.toml (user-global)

# Slack channel to bridge to (required). Either a channel ID like
# "C0123456789" (resolved without an API call) or a channel name like
# "general" / "#general" (resolved by listing the channels you're in).
# channel = "general"
# channel = "C0123456789"

# Shell command to spawn (default: cmd.exe on Windows, $SHELL on Mac/Linux)
# shell = "cmd.exe"
# shell = "/bin/zsh"
# shell = "powershell.exe"

# Workspace name (as saved by --login) or URL
# workspace = "My Workspace"

# Terminal dimensions (default: 120 cols x 24 rows)
# cols = 120
# rows = 24

# Minimum seconds between Slack message updates in TUI mode (default: 1)
# update_interval_secs = 1

# Re-anchor the live TUI message every N inbound Slack messages so it stays
# near the bottom of the channel as you type. 0 disables. Default: 10.
# anchor_refresh = 10

# Friendly display name for the session, used in start / exit / restart
# banners and the local terminal window title. Default: "CliBridge".
# Can be changed at runtime with `--name <text>` from Slack.
# name = "build server"

# Lines of scroll buffer to keep above the live TUI frame in the rendered
# Slack message. Lets you scroll back to content the app pushed past the
# top of the screen. 0 disables. Default: 10000.
# scroll_buffer = 10000

# Replace Unicode Block Elements (U+2580–U+259F: █ ▌ ▐ ▛ etc.) with spaces
# in messages sent to Slack. Slack's code-block font lacks glyphs for
# these and falls back to a wider font, which pushes box-drawing layouts
# out of column (e.g. the Claude Code welcome banner). The local attach
# window is unaffected. Default: false.
# replace_block_chars = false
