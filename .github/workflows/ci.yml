# CI: Build + Test on every push to main and every PR.
# Produces debug artifacts for quick iteration.
# Also serves as the nightly channel — auto-publishes a dev release on green.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}${{ runner.os == 'Linux' && ', x86_64-unknown-linux-musl' || '' }}
          components: rustfmt, clippy

      # wry/tao need GTK + WebKit on Linux for the embedded login browser.
      # musl-tools is for the headless static build below. Windows uses
      # WebView2 from the OS; macOS uses WKWebView from the OS.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.target }}

      # ----- Lint gates -----
      - name: cargo fmt --check
        if: matrix.os == 'windows-latest'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # ----- Build + test -----
      - name: cargo build
        run: cargo build --all-targets

      # The headless Linux binary is a shipped release variant: a static musl
      # build (no glibc/WebKit/OpenSSL) so it runs on any distro. Build it the
      # same way the release does so CI catches musl/static breakage early.
      - name: cargo build (headless musl, Linux)
        if: runner.os == 'Linux'
        run: cargo build -p cli-bridge --no-default-features --target x86_64-unknown-linux-musl

      - name: cargo test
        run: cargo test

      # ----- Artifact upload -----
      - name: Upload binary (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cli-bridge-debug-windows-${{ github.sha }}
          path: target/debug/cli-bridge.exe
          retention-days: 7

      - name: Upload binary (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cli-bridge-debug-macos-${{ github.sha }}
          path: target/debug/cli-bridge
          retention-days: 7

      - name: Upload binary (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cli-bridge-debug-linux-${{ github.sha }}
          path: target/debug/cli-bridge
          retention-days: 7

  # Auto-publish nightly release on green CI (push to main only)
  auto-release-nightly:
    name: Auto-publish nightly
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch release.yml with channel=nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Dispatching release.yml for channel=nightly at ${BUILD_SHA}"
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f channel=nightly \
            -f head_sha="${BUILD_SHA}"
